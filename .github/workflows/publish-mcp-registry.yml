name: Publish to MCP Registry

on:
  push:
    branches: [main]
    paths:
      - server.json
      - .github/workflows/publish-mcp-registry.yml
      - scripts/check-mcp-registry-version.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'General-Intelligence-Company/cofounder-plugin' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check published version
        id: version
        run: python3 scripts/check-mcp-registry-version.py

      - name: Install mcp-publisher
        if: steps.version.outputs.publish == 'true'
        run: |
          curl --fail --silent --show-error --location https://github.com/modelcontextprotocol/registry/releases/download/v1.8.4/mcp-publisher_linux_amd64.tar.gz -o "$RUNNER_TEMP/mcp-publisher.tar.gz"
          echo "5dc2fd415369c73551259f31cd33e2aacc9e0d1021e7f08fef1492d93b781628  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/mcp-publisher-bin"
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP/mcp-publisher-bin" mcp-publisher
          echo "$RUNNER_TEMP/mcp-publisher-bin" >> "$GITHUB_PATH"

      - name: Authenticate and publish
        if: steps.version.outputs.publish == 'true'
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish
